<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trình Minh Họa Thuật Toán Dijkstra</title>
    <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
    <h1>Trình Minh Họa Thuật Toán Dijkstra</h1>

    <div id="controls">
        <button id="btn-add-node">Thêm Đỉnh</button>
        <button id="btn-add-edge">Thêm Cạnh (2 bước)</button>
        <button id="btn-set-start">Chọn Đỉnh Bắt Đầu</button>
        <button id="btn-run" disabled>Chạy Dijkstra!</button>
        <button id="btn-reset">Reset</button>
    </div>

    <p id="status-text">Trạng thái: Chọn một hành động.</p>

    <div id="canvas-container">
        <canvas id="graph-canvas"></canvas>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
